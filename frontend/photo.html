<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table detection · Smart Table Finder</title>
<style>
  * { box-sizing: border-box; }
  body { margin: auto; padding: 2rem 1rem; max-width: 64rem; font: 1rem/1.5 system-ui,sans-serif; color: #17263b; background: #f5f7fa; }
  h1 { margin-bottom: .25rem; }
  section { background: white; padding: 1rem; border: 1px solid #ced7e2; border-radius: .6rem; }
  button, input { font: inherit; margin: .25rem; }
  button { padding: .4rem .8rem; }
  canvas, video { max-width: 100%; height: auto; }
  canvas { display: block; margin-top: 1rem; }
  canvas[hidden] { display: none; }
</style>
<main>
  <a href="/">← Live dashboard</a>
  <h1>Table detection</h1>
  <p>Choosing a file starts analysis automatically. Photos and sampled video frames are sent to Roboflow. The team demo video can also run locally when cloud detection is unavailable.</p>
  <section>
    <button id="choose" type="button">Choose photo or video</button>
    <input id="file" type="file" hidden accept="image/jpeg,image/png,video/mp4">
    <span id="filename">No file selected</span>
    <button id="run" hidden>Restart detection</button>
    <button id="stop" hidden>Stop sampling</button>
    <p id="message" role="status">Choose a file to begin.</p>
    <p id="analysis" hidden style="white-space:pre-wrap"></p>
    <div id="player" hidden>
      <video id="video" hidden muted playsinline loop></video>
      <div>
        <button id="play" type="button">Play</button>
        <input id="seek" type="range" aria-label="Video position in seconds" min="0" max="0" step="0.1" value="0">
        <span id="time"></span>
        <button id="expand" type="button">Full screen</button>
      </div>
    </div>
    <canvas id="result" hidden aria-label="Selected frame with detected table locations"></canvas>
  </section>
</main>
<script src="/demo-detector.js"></script>
<script>
const el = id => document.getElementById(id);
const file = el("file"), video = el("video"), result = el("result"), run = el("run");
el("choose").onclick = () => file.click();
el("play").onclick = () => video.paused ? video.play() : video.pause();
video.onplay = () => { el("play").textContent = "Pause"; };
video.onpause = () => { el("play").textContent = "Play"; };
const clock = seconds => Math.floor(seconds / 60) + ":" + String(Math.floor(seconds % 60)).padStart(2, "0");
video.ontimeupdate = () => {
  if (!Number.isFinite(video.duration)) return;
  el("seek").max = video.duration;
  el("seek").value = video.currentTime;
  el("time").textContent = clock(video.currentTime) + " / " + clock(video.duration);
};
el("seek").oninput = () => { video.currentTime = Number(el("seek").value); };
el("expand").onclick = () => document.fullscreenElement ? document.exitFullscreen() : el("player").requestFullscreen();
document.onfullscreenchange = () => { el("expand").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; };
let source, objectURL, generation = 0, timer, fallback;
function stop() {
  generation++;
  clearTimeout(timer);
  video.pause();
  el("stop").hidden = true;
  run.disabled = !source;
  run.hidden = !source;
}
el("stop").onclick = () => { stop(); el("message").textContent = "Sampling stopped."; };
file.onchange = async () => {
  stop();
  const version = generation;
  source = null;
  fallback = null;
  run.hidden = true;
  el("analysis").hidden = true;
  run.disabled = true;
  el("player").hidden = video.hidden = result.hidden = true;
  if (objectURL) URL.revokeObjectURL(objectURL);
  const selected = file.files[0];
  el("filename").textContent = selected ? selected.name : "No file selected";
  if (!selected) return;
  objectURL = URL.createObjectURL(selected);
  try {
    if (selected.type.startsWith("video/") || /\.mp4$/i.test(selected.name)) {
      video.src = objectURL;
      await new Promise((resolve, reject) => { video.onloadeddata = resolve; video.onerror = reject; });
      if (version !== generation) return;
      source = video;
      el("player").hidden = video.hidden = false;
      const detector = await demoDetector(selected, video);
      if (version !== generation) return;
      fallback = detector;
    } else {
      const image = new Image();
      image.src = objectURL;
      await image.decode();
      if (version !== generation) return;
      source = image;
    }
    run.disabled = false;
    await run.onclick();
  } catch { if (version === generation) el("message").textContent = "This file could not be opened."; }
};
run.onclick = async () => {
  stop();
  const version = generation;
  run.disabled = true;
  run.hidden = true;
  result.hidden = true;
  el("analysis").hidden = true;
  const movie = source === video;
  let local = false;
  el("stop").hidden = !movie;
  async function sample() {
    const started = performance.now();
    const frame = document.createElement("canvas");
    frame.width = movie ? video.videoWidth : source.naturalWidth;
    frame.height = movie ? video.videoHeight : source.naturalHeight;
    frame.getContext("2d").drawImage(source, 0, 0);
    const data = new FormData();
    const blob = await new Promise(resolve => frame.toBlob(resolve, "image/jpeg", .92));
    if (version !== generation) return;
    data.append("file", blob, "frame.jpg");
    const endpoint = movie ? "/detect/photo" : "/detect/photo?analyze=true";
    let body;
    if (!local) {
      const response = await fetch(endpoint, {method: "POST", body: data});
      body = await response.json();
      if (version !== generation) return;
      if (!response.ok) {
        if (movie && fallback && [429,502,503].includes(response.status)) local = true;
        else throw Error(body.detail || "Detection failed.");
      }
    }
    if (local) body = fallback(frame);
    result.width = frame.width;
    result.height = frame.height;
    const ctx = result.getContext("2d");
    ctx.drawImage(frame, 0, 0);
    ctx.scale(frame.width / body.image.width, frame.height / body.image.height);
    const size = Math.max(12, body.image.width / 85);
    ctx.font = "bold " + size + "px sans-serif";
    ctx.lineWidth = Math.max(2, size / 6);
    for (const box of body.predictions) {
      const x = box.x - box.width / 2, y = box.y - box.height / 2;
      ctx.strokeStyle = ctx.fillStyle = "#075985";
      ctx.strokeRect(x, y, box.width, box.height);
      const top = Math.max(0, y - size * 1.5);
      ctx.fillRect(x, top, ctx.measureText(box.label).width + 8, size * 1.5);
      ctx.fillStyle = "white";
      ctx.fillText(box.label, x + 4, top + size);
    }
    result.hidden = false;
    el("message").textContent = local ? "Local demo analysis · 21 calibrated tables · estimated seat occupancy" : body.predictions.length + " table boxes detected.";
    if (!movie) {
      el("analysis").textContent = body.analysis ? "Claude analysis\n" + body.analysis : body.analysis_error;
      el("analysis").hidden = false;
    }
    if (movie) timer = setTimeout(next, Math.max(0, 1000 - (performance.now() - started)));
    else run.disabled = false;
  }
  async function next() {
    try { await sample(); }
    catch (error) {
      if (version !== generation) return;
      stop();
      el("message").textContent = error.message;
    }
  }
  el("message").textContent = "Detecting tables…";
  if (movie) {
    try { await video.play(); }
    catch { stop(); el("message").textContent = "Video playback could not start."; return; }
  }
  if (version === generation) await next();
};
</script>
</html>
